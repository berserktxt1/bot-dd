name: Windows build

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# o token só lê o repositório; nenhum segredo é usado
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    # imagem fixa: o ubuntu-latest passa a ser o Ubuntu 26 a partir de 2026-10-19
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes src tools tests
      - name: Testes (Linux + Xvfb)
        run: xvfb-run -a python -m pytest -q tests -rs

  build-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12.10"
          architecture: x64

      - name: Dependências
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Testes (código-fonte, inclui interface)
        run: python -m pytest -q tests -rs --junitxml=test-results/pytest-windows.xml

      - name: Testes com janelas reais num venv e com o navegador aberto, cada um 3 vezes
        # como no PC do usuário: o python.exe de um venv é um redirecionador que abre o Python base como
        # processo filho (o pid do Popen não é o dono da janela) e há um navegador maximizado na tela
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\venv-janelas"
          $py = "$env:RUNNER_TEMP\venv-janelas\Scripts\python.exe"
          & $py -m pip install -q -r requirements.txt -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { Write-Error "dependências do venv"; exit 1 }
          $nav = @("C:\Program Files\Google\Chrome\Application\chrome.exe",
                   "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          $browser = $null
          if ($nav) {
            $browser = Start-Process $nav -PassThru -ArgumentList @("--start-maximized", "--no-first-run",
              "--no-default-browser-check", "--user-data-dir=$env:RUNNER_TEMP\nav", "about:blank")
            Start-Sleep -Seconds 6
            Write-Host "navegador aberto: $nav (pid $($browser.Id))"
          } else { Write-Host "nenhum navegador encontrado no runner" }
          $tests = @("test_launcher_then_game_in_child_process", "test_pick_at_real_window",
                     "test_two_launchers_game_linked_to_the_one_that_opened_it", "test_capture_of_covered_game_is_the_game")
          $fail = @()
          try {
            foreach ($i in 1..3) {
              foreach ($t in $tests) {
                & $py -m pytest -q "tests/test_windows_real.py::$t" -p no:cacheprovider
                if ($LASTEXITCODE -ne 0) { $fail += "$t (rodada $i)" }
              }
            }
          } finally {
            if ($browser) { taskkill /PID $browser.Id /T /F | Out-Null }
          }
          if ($fail.Count) { Write-Error "falharam: $($fail -join '; ')"; exit 1 }
          Write-Host "todos os testes de janelas reais passaram 3 vezes no venv"

      - name: Testes com a escala do Windows em 125% (janelas reais 3 vezes cada, depois a suíte completa)
        # como num PC com escala de 125%: o Python das janelas de teste (como muitos jogos) não tem suporte a
        # DPI e o Windows amplia a imagem dele na tela; a captura precisa trazer a imagem inteira do jogo
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "resolução mantida: $_" }
          python tools/display_scale.py 125
          if ($LASTEXITCODE -ne 0) { Write-Error "não foi possível pôr a tela em 125%"; exit 1 }
          $py = "$env:RUNNER_TEMP\venv-janelas\Scripts\python.exe"
          $out = "$env:RUNNER_TEMP\escala-125"
          New-Item -ItemType Directory -Force $out | Out-Null  # o --basetemp do pytest não cria a pasta-mãe
          $tests = @("test_launcher_then_game_in_child_process", "test_pick_at_real_window",
                     "test_two_launchers_game_linked_to_the_one_that_opened_it", "test_capture_of_covered_game_is_the_game")
          $fail = @()
          try {
            foreach ($i in 1..3) {
              foreach ($t in $tests) {
                & $py -m pytest -q "tests/test_windows_real.py::$t" -p no:cacheprovider --basetemp "$out\$t-$i"
                if ($LASTEXITCODE -ne 0) { $fail += "$t (rodada $i)" }
              }
            }
            & $py -m pytest -q tests -rs -p no:cacheprovider --basetemp "$out\suite" --junitxml=test-results/pytest-windows-125.xml
            if ($LASTEXITCODE -ne 0) { $fail += "suíte completa" }
          } finally {
            python tools/display_scale.py 100
            # capturas recusadas pelos testes (diagnóstico); só as imagens, nada da pasta de dados dos testes
            Get-ChildItem $out -Recurse -Filter *.png -ErrorAction SilentlyContinue | ForEach-Object {
              New-Item -ItemType Directory -Force test-results/escala-125 | Out-Null
              Copy-Item $_.FullName "test-results/escala-125/$($_.Directory.Parent.Name)-$($_.Directory.Name)-$($_.Name)" }
          }
          if ($fail.Count) { Write-Error "falharam em 125%: $($fail -join '; ')"; exit 1 }
          Write-Host "em 125%: janelas reais 3 vezes cada e a suíte completa aprovados"

      - name: Compilar (build_windows.bat)
        shell: cmd
        run: build_windows.bat --sem-testes

      - name: Conferir arquivos do pacote
        shell: pwsh
        run: |
          $need = @(
            "release/JonFlow/JonFlow.exe",
            "release/JonFlow.zip",
            "release/JonFlow.exe",
            "release/JonFlow/LEIA-ME.md",
            "release/JonFlow/COMO-USAR.txt",
            "release/JonFlow/_internal/data/knowledge/angle_tables.json",
            "release/JonFlow/_internal/data/knowledge/model_params.json",
            "release/JonFlow/_internal/config/default_config.json",
            "release/JonFlow/_internal/assets/jonflow-icon.png"
          )
          foreach ($f in $need) { if (-not (Test-Path $f)) { Write-Error "faltando: $f"; exit 1 } else { Write-Host "ok: $f" } }
          Get-Item release/JonFlow.zip | Select-Object Name, Length
          # nomes com "/" e sem a pasta pessoal 'dados' dentro do pacote
          python -c "import zipfile; n = zipfile.ZipFile('release/JonFlow.zip').namelist(); bad = [x for x in n if chr(92) in x]; assert not bad, bad[:3]; assert 'JonFlow/JonFlow.exe' in n; assert not any(x.startswith('JonFlow/dados/') for x in n), 'dados pessoais no ZIP'; print(len(n), 'arquivos no ZIP')"
          if ($LASTEXITCODE -ne 0) { Write-Error "ZIP inválido"; exit 1 }
          # formato do sha256sum: "<hash>  <arquivo>"
          $lines = foreach ($f in @("JonFlow.zip", "JonFlow.exe")) {
            "$((Get-FileHash "release/$f" -Algorithm SHA256).Hash.ToLower())  $f"
          }
          $lines | Out-File -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - name: Testar o .exe compilado (autoteste, interface e pasta somente leitura)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          # ($args é variável automática do PowerShell: não usar como nome de parâmetro)
          function Run-Exe($exe, [string[]]$argList, $timeoutMs) {
            $p = Start-Process $exe -ArgumentList $argList -PassThru
            if (-not $p.WaitForExit($timeoutMs)) { $p.Kill($true); Write-Error "o exe travou ($($argList -join ' '))"; exit 1 }
            return $p.ExitCode
          }
          # cópia extraída do ZIP: simula outro computador sem Python no PATH
          Expand-Archive release/JonFlow.zip -DestinationPath zipcheck -Force
          $exe = (Resolve-Path "zipcheck/JonFlow/JonFlow.exe").Path
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $env:DDBOT_SELFTEST_OUT = "$PWD/test-results/exe-selftest.json"
          $code = Run-Exe $exe "--selftest" 180000
          Get-Content $env:DDBOT_SELFTEST_OUT
          if ($code -ne 0) { Write-Error "autoteste do exe falhou ($code)"; exit 1 }
          if (Test-Path "zipcheck/JonFlow/dados") { Write-Error "o autoteste não deveria criar dados ao lado do exe"; exit 1 }
          $env:DDBOT_SMOKE_OUT = "$PWD/test-results/exe-gui-smoke.json"
          $code = Run-Exe $exe @("--gui-smoke","8") 120000
          Get-Content $env:DDBOT_SMOKE_OUT
          if ($code -ne 0) { Write-Error "teste de interface do exe falhou ($code)"; exit 1 }
          if (-not (Test-Path "zipcheck/JonFlow/dados/config.json")) { Write-Error "dados/config.json não criado"; exit 1 }
          # sem como gravar ao lado do exe (ex.: Arquivos de Programas): usa %LOCALAPPDATA%.
          # Simulado com um ARQUIVO chamado 'dados' (impede criar a pasta); negar escrita com icacls
          # também impede o Windows de iniciar o processo no runner.
          Expand-Archive release/JonFlow.zip -DestinationPath rocheck -Force
          Set-Content -Path rocheck/JonFlow/dados -Value "bloqueio"
          $env:DDBOT_SMOKE_OUT = "$PWD/test-results/exe-gui-smoke-readonly.json"
          $code = Run-Exe (Resolve-Path "rocheck/JonFlow/JonFlow.exe").Path @("--gui-smoke","8") 120000
          if ($code -ne 0) { Write-Error "exe em pasta somente leitura falhou ($code)"; exit 1 }
          if (-not (Test-Path "$env:LOCALAPPDATA/JonFlow/config.json")) { Write-Error "fallback para LOCALAPPDATA não criou a configuração"; exit 1 }
          # arquivo único: sozinho numa pasta vazia (sem _internal), sem Python no PATH
          New-Item -ItemType Directory -Force unico | Out-Null
          Copy-Item release/JonFlow.exe unico/
          $one = (Resolve-Path "unico/JonFlow.exe").Path
          $env:DDBOT_SELFTEST_OUT = "$PWD/test-results/exe-unico-selftest.json"
          $code = Run-Exe $one "--selftest" 240000
          Get-Content $env:DDBOT_SELFTEST_OUT
          if ($code -ne 0) { Write-Error "autoteste do exe de arquivo único falhou ($code)"; exit 1 }
          $env:DDBOT_SMOKE_OUT = "$PWD/test-results/exe-unico-gui-smoke.json"
          $code = Run-Exe $one @("--gui-smoke","8") 180000
          Get-Content $env:DDBOT_SMOKE_OUT
          if ($code -ne 0) { Write-Error "teste de interface do exe de arquivo único falhou ($code)"; exit 1 }
          if (-not (Test-Path "unico/dados/config.json")) { Write-Error "o exe de arquivo único não criou dados/config.json ao lado de si"; exit 1 }
          Remove-Item Env:DDBOT_SMOKE_OUT, Env:DDBOT_SELFTEST_OUT

      - name: Capturas da interface (100%, 125%, 150%)
        shell: pwsh
        continue-on-error: true
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "resolução mantida: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "tela: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
          $exe = (Resolve-Path "zipcheck/JonFlow/JonFlow.exe").Path
          New-Item -ItemType Directory -Force screenshots | Out-Null
          foreach ($scale in @("1.0","1.25","1.5")) {
            $env:DDBOT_UI_SCALE = $scale
            $env:DDBOT_HOME = "$PWD/shots-home-$scale"
            $p = Start-Process $exe -ArgumentList @("--screenshots", "$PWD/screenshots") -PassThru
            if (-not $p.WaitForExit(420000)) { $p.Kill($true); Write-Host "capturas travaram em $scale" }
          }
          Get-ChildItem screenshots | Select-Object Name, Length

      - name: Relatório de módulos ausentes do PyInstaller
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          if (Test-Path build/JonFlow/warn-JonFlow.txt) {
            Copy-Item build/JonFlow/warn-JonFlow.txt test-results/
            Select-String -Path build/JonFlow/warn-JonFlow.txt -Pattern "ddbot|pynput" | ForEach-Object { Write-Host $_ }
          }

      - name: Registro da compilação e notas da versão
        shell: pwsh
        run: |
          $xml = [xml](Get-Content test-results/pytest-windows.xml)
          $suite = $xml.testsuites.testsuite
          $passed = [int]$suite.tests - [int]$suite.failures - [int]$suite.errors - [int]$suite.skipped
          $tests = "$passed de $($suite.tests) aprovados ($($suite.failures) falhas, $($suite.skipped) pulados)"
          $sums = @{}
          foreach ($l in Get-Content release/SHA256SUMS.txt) { $p = $l -split "  "; $sums[$p[1]] = $p[0] }
          $pyi = (python -m PyInstaller --version).Trim()
          $info = [ordered]@{
            versao = (python -c "import sys; sys.path.insert(0, 'src'); import ddbot; print(ddbot.__version__)").Trim()
            commit = "${{ github.sha }}"
            ref = "${{ github.ref }}"
            ci_execucao = "${{ github.run_id }}"
            ci_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            compilado_em = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            python = (python --version).Trim()
            pyinstaller = $pyi
            testes_windows = $tests
            sha256 = $sums
          }
          $info | ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 release/build-info.json
          Get-Content release/build-info.json
          (Get-Content docs/RELEASE_NOTES.md -Raw).Replace("{COMMIT}", "${{ github.sha }}").Replace("{RUN_URL}", $info.ci_url).Replace("{TESTES}", $tests).Replace("{SHA_ZIP}", $sums["JonFlow.zip"]).Replace("{SHA_EXE}", $sums["JonFlow.exe"]) | Out-File -Encoding utf8 release/release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: JonFlow-windows
          path: |
            release/JonFlow.zip
            release/JonFlow.exe
            release/SHA256SUMS.txt
            release/build-info.json
            release/release-notes.md
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: relatorios-de-teste
          path: test-results/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: capturas-da-interface
          path: screenshots/
          if-no-files-found: warn

  # Só em tags v*: cria a Release com os arquivos testados acima (único job que escreve no repositório)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-linux, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: JonFlow-windows
          path: pacote
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: relatorios-de-teste
          path: relatorios
      - name: Publicar a Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd pacote && sha256sum -c SHA256SUMS.txt)
          # o pacote precisa ser deste commit e desta versão (nunca um binário antigo com a versão nova)
          python3 - <<'PY'
          import json, os
          info = json.load(open("pacote/build-info.json", encoding="utf-8-sig"))
          tag = os.environ["TAG"]
          assert info["commit"] == os.environ["GITHUB_SHA"], (info["commit"], os.environ["GITHUB_SHA"])
          assert "v" + info["versao"] == tag, (info["versao"], tag)
          assert " 0 falhas" in info["testes_windows"].replace("(", " "), info["testes_windows"]
          print("pacote confere:", info["versao"], info["commit"], info["testes_windows"])
          PY
          (cd relatorios && zip -qr ../relatorios-de-teste.zip .)
          files="pacote/JonFlow.zip pacote/JonFlow.exe pacote/SHA256SUMS.txt pacote/build-info.json relatorios-de-teste.zip"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file pacote/release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $files --verify-tag --title "JonFlow ${TAG#v}" \
              --notes-file pacote/release-notes.md --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size)")'
