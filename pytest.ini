[pytest]
# Captura só no nível do Python (sys). A captura padrão (fd) troca os handles padrão do Windows a cada teste e
# fecha os anteriores; o Tcl guarda canais padrão com esses handles e, depois, criar um Tk às vezes falha
# ("Can't find a usable init.tcl/tk.tcl"). Diagnóstico 39530426640: suíte completa no Windows, 1 de 2 falhou com
# fd e 2 de 2 passaram com sys.
addopts = --capture=sys
